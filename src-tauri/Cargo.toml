[package]
name = "notscreenstudio-win-app"
description = "Tauri shell: tray, HUD windows, hotkeys, IPC commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "notscreenstudio"
path = "src/main.rs"

[features]
# Enabled automatically by `tauri build` (or explicitly via `--features custom-protocol`)
# so release executables embed `ui/dist` instead of pointing at the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

nss-core = { workspace = true }
nss-motion = { workspace = true }
nss-project = { workspace = true }
nss-render = { workspace = true }
nss-capture = { workspace = true }
nss-input = { workspace = true }
nss-export = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
