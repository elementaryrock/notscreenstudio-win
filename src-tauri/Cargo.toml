[package]
name = "notscreenstudio-win-app"
description = "Tauri shell: tray, HUD windows, hotkeys, IPC commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "notscreenstudio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

nss-core = { workspace = true }
nss-motion = { workspace = true }
nss-project = { workspace = true }

# Stage 4-7 add: nss-render, nss-capture, nss-input, nss-export.
# Stage 8 adds: tauri features ["tray-icon"], windows (Win32 HUD + hotkeys).
