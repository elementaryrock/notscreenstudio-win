[package]
name = "nss-render"
description = "wgpu single-pass compositor and render layout (replaces NSSRender/MetalRenderer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nss-core = { workspace = true }
nss-motion = { workspace = true }
thiserror = { workspace = true }
wgpu = "30"
pollster = "0.4"
half = "2"
# PNG/JPEG/WebP/BMP decode for user background images and Windows wallpapers.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
