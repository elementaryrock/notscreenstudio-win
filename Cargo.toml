[workspace]
resolver = "2"
members = [
    "crates/nss-core",
    "crates/nss-motion",
    "crates/nss-project",
    "crates/nss-capture",
    "crates/nss-input",
    "crates/nss-render",
    "crates/nss-export",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.86 is where f64::next_up/next_down stabilised; the viewport clamp needs them to
# land the camera exactly on the source edge (see docs/ADR/0009-core-traits.md).
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/dotslashsimran/notscreenstudio"
authors = ["notscreenstudio-win contributors"]

[workspace.dependencies]
# Pure, platform-neutral crates (see PLAN.md §3: these must not link windows/wgpu/tauri).
nss-core = { path = "crates/nss-core" }
nss-motion = { path = "crates/nss-motion" }
nss-project = { path = "crates/nss-project" }
nss-capture = { path = "crates/nss-capture" }
nss-input = { path = "crates/nss-input" }
nss-render = { path = "crates/nss-render" }
nss-export = { path = "crates/nss-export" }

serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes serde_json parse f64 exactly. Without it a stored value can come
# back 1 ULP off, which breaks save/load round-trip equality on user projects.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
parking_lot = "0.12"
sha2 = "0.10"
proptest = "1"
tempfile = "3"
# Recycle Bin only (SHFileOperationW). Everything else uses `std`.
windows-sys = { version = "0.61", default-features = false }

[profile.dev]
# Debug builds of the renderer are unusably slow; keep some optimisation in deps.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
